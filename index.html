<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123e55"><title>船舶加油英语 | Bunkering English</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f3;color:#173245;font:16px system-ui,-apple-system,sans-serif}main{max-width:610px;margin:auto;min-height:100vh;background:white;padding:22px 16px 55px}h1{margin:4px 0;font-size:26px}small,.muted{color:#607581}header{margin-bottom:17px}.box{padding:18px;border:1px solid #d2e1e9;border-radius:17px;margin:14px 0;box-shadow:0 3px 15px #092e4309}.card{background:#f1f7fa;border-radius:15px;text-align:center;padding:34px 15px;margin:17px 0}.en{font-weight:750;color:#103f5a;font-size:23px;line-height:1.4}.zh{margin-top:13px;font-size:18px}.bar{height:10px;background:#dce8ed;border-radius:20px;overflow:hidden;margin-top:10px}.fill{background:#19846f;height:100%;width:0}.flex{display:flex;gap:9px;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button{background:#e5eff3;color:#1a4960}.tabs button.active{background:#174e67;color:white}button{border:0;border-radius:11px;background:#145777;color:white;padding:13px 15px;font:600 15px system-ui;cursor:pointer;min-height:46px}button.secondary{background:#e7f0f4;color:#214b61}button:disabled{opacity:.5}.flex button{flex:1}.hide{display:none}.choice{display:block;width:100%;text-align:left;background:white;color:#244558;border:1px solid #b7d2df;margin:9px 0}.correct{background:#d9f3e9!important}.wrong{background:#ffe1df!important}.word{background:#e2eef6;color:#193c52;margin:4px;padding:10px}.selected{min-height:57px;border:1px dashed #a4c7d5;border-radius:11px;padding:7px;margin-top:14px}.note{font-size:13px;line-height:1.55;background:#fff7de;padding:13px;border-radius:12px;margin-top:23px}.feedback{min-height:23px;font-weight:650}button:focus-visible{outline:3px solid orange;outline-offset:2px}</style></head><body><main><header><h1>船舶加油英语</h1><small>Bunkering English · iPhone 体验版 · 前10句</small></header><div class="box"><b>学习进度</b><span id="progress" style="float:right"></span><div class="bar"><div class="fill" id="fill"></div></div><small id="score"></small></div><nav class="tabs"><button class="active" data-tab="learn">学习</button><button data-tab="quiz">听力</button><button data-tab="build">组句</button></nav><section id="learn" class="box"><h3>学习句子 <span id="count"></span></h3><div class="card"><div id="en" class="en"></div><div id="zh" class="zh"></div></div><div class="flex"><button id="speak">▶ 正常语速</button><button class="secondary" id="slow">▶ 慢速</button></div><div class="flex" style="margin-top:10px"><button class="secondary" id="prev">上一句</button><button id="learned">✓ 我学会了</button><button class="secondary" id="next">下一句</button></div></section><section id="quiz" class="box hide"><h3>听音选择</h3><p class="muted">播放英文，选择正确的中文意思。</p><div class="flex"><button id="playQuiz">▶ 播放英语</button><button class="secondary" id="slowQuiz">慢速</button></div><div id="choices"></div><p id="feedback" class="feedback"></p><button id="nextQuiz">下一题 →</button></section><section id="build" class="box hide"><h3>英文组句</h3><p class="muted">根据中文提示，按正确顺序点击英文单词。</p><div class="card"><div id="buildZh" class="zh"></div></div><div class="selected" id="selected"></div><div id="bank"></div><p class="feedback" id="buildFeedback"></p><div class="flex"><button class="secondary" id="reset">重试</button><button id="check">检查答案</button><button class="secondary" id="nextBuild">下一题</button></div></section><div class="note"><b>安全提示：</b>本应用只用于练习雇主提供的英语句子，不代替专业培训或正式操作规程。实际作业应遵循现场主管和批准的安全程序。</div><p class="muted" style="font-size:12px">学习记录保存在当前浏览器。清除 Safari 网站数据可能导致记录丢失。语音效果取决于 iPhone 已安装的声音。</p></main><script>
"use strict";
const S=[["We will start bunkering soon.","我们马上开始加油。"],["Are you ready for bunkering?","你们准备好加油了吗？"],["Please stand by for bunkering.","请做好加油准备。"],["When can you start bunkering?","你们什么时候能开始？"],["Please send your bunker clerk on board.","请让加油员上船。"],["Please show me your ID card.","请出示证件。"],["Please sign the safety checklist.","请在安全检查表签字。"],["No smoking on deck during bunkering.","加油期间甲板禁止吸烟。"],["No open flames allowed.","禁止明火。"],["Keep fire-fighting equipment ready.","消防器材保持可用。"]];
const $=x=>document.getElementById(x),key="bunkering-v01";let st;try{st=JSON.parse(localStorage.getItem(key)||"{}")}catch{st={}};if(!Array.isArray(st.done))st.done=[];if(!Number.isFinite(st.score))st.score=0;
let idx=0,q=0,b=0,answered=false,chosen=[],tokens=[],scoredBuild=false;
function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch{}progress()}
function progress(){$("progress").textContent=st.done.length+" / 10";$("fill").style.width=(st.done.length*10)+"%";$("score").textContent="累计答对 "+st.score+" 题 · 自动保存"}
function speak(s,rate){if(!("speechSynthesis"in window)){alert("当前浏览器不支持朗读");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang="en-US";u.rate=rate;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==="en-US"&&v.localService)||vs.find(v=>v.lang.startsWith("en")&&v.localService)||vs.find(v=>v.lang.startsWith("en"))||null;speechSynthesis.speak(u)}
function learn(){$("en").textContent=S[idx][0];$("zh").textContent=S[idx][1];$("count").textContent=(idx+1)+"/10";$("learned").textContent=st.done.includes(idx)?"✓ 已学会":"✓ 我学会了";$("prev").disabled=idx===0;$("next").disabled=idx===9}
function shuffle(a){return a.sort(()=>Math.random()-.5)}
function random(old){let n=Math.floor(Math.random()*S.length);return n===old?(n+1)%S.length:n}
function quiz(){q=random(q);answered=false;$("feedback").textContent="";$("choices").innerHTML="";let ids=shuffle([q,...shuffle([...S.keys()].filter(x=>x!==q)).slice(0,3)]);ids.forEach(i=>{let btn=document.createElement("button");btn.className="choice";btn.textContent=S[i][1];btn.onclick=()=>{if(answered)return;answered=true;btn.classList.add(i===q?"correct":"wrong");[...$("choices").children].forEach(x=>{x.disabled=true;if(x.textContent===S[q][1])x.classList.add("correct")});$("feedback").textContent=i===q?"✓ 答对了！":"正确答案已标记，请再听一遍。";if(i===q){st.score++;save()}};$("choices").append(btn)})}
function build(){b=random(b);chosen=[];scoredBuild=false;tokens=shuffle(S[b][0].split(" ").map((word,id)=>({word,id})));$("buildZh").textContent=S[b][1];$("buildFeedback").textContent="";draw()}
function draw(){$("selected").innerHTML="";$("bank").innerHTML="";chosen.forEach(id=>{let t=tokens.find(x=>x.id===id);let btn=document.createElement("button");btn.className="word";btn.textContent=t.word;btn.onclick=()=>{chosen=chosen.filter(x=>x!==id);draw()};$("selected").append(btn)});tokens.filter(t=>!chosen.includes(t.id)).forEach(t=>{let btn=document.createElement("button");btn.className="word";btn.textContent=t.word;btn.onclick=()=>{chosen.push(t.id);draw()};$("bank").append(btn)})}
document.querySelectorAll("[data-tab]").forEach(btn=>btn.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===btn));["learn","quiz","build"].forEach(x=>$(x).classList.toggle("hide",x!==btn.dataset.tab));if("speechSynthesis"in window)speechSynthesis.cancel()});
$("speak").onclick=()=>speak(S[idx][0],1);$("slow").onclick=()=>speak(S[idx][0],.75);$("prev").onclick=()=>{idx=Math.max(0,idx-1);learn()};$("next").onclick=()=>{idx=Math.min(9,idx+1);learn()};$("learned").onclick=()=>{if(!st.done.includes(idx)){st.done.push(idx);save()}if(idx<9)idx++;learn()};
$("playQuiz").onclick=()=>speak(S[q][0],1);$("slowQuiz").onclick=()=>speak(S[q][0],.75);$("nextQuiz").onclick=quiz;
$("reset").onclick=()=>{chosen=[];$("buildFeedback").textContent="";draw()};$("check").onclick=()=>{if(chosen.length!==tokens.length){$("buildFeedback").textContent="请先使用所有单词。";return}let good=chosen.every((id,pos)=>id===pos);$("buildFeedback").textContent=good?"✓ 完全正确！":"再试一次。正确句子："+S[b][0];if(good&&!scoredBuild){scoredBuild=true;st.score++;save()}};$("nextBuild").onclick=build;
progress();learn();quiz();build();
</script></body></html>
